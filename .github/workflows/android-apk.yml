name: Gerar APK Meu Templo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Gerar site
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Meu-Templo.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Templo-Android
          path: Meu-Templo.apk
          retention-days: 30
