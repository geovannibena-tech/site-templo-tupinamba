name: Gerar iPhone Meu Templo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Gerar site
        run: npm run build

      - name: Criar e sincronizar projeto iOS
        run: |
          if [ ! -d ios/App ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Diagnosticar ferramentas iOS
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -35
          ls -la ios/App

      - name: Compilar app para simulador sem assinatura
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compactar app do simulador
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          test -d App.app
          zip -r Meu-Templo-iPhone-Simulator.zip App.app

      - name: Disponibilizar build de simulador
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Templo-iPhone-Simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/Meu-Templo-iPhone-Simulator.zip
          retention-days: 30
